name: Update berth data

# Reads the terminal's sailing list every 15 minutes and publishes when something changed
# (or hourly as a heartbeat). No AI involved: research of new ships is done by a separate
# Claude Code task, which this workflow starts through its API trigger when needed.
#
# GitHub's own cron proved unreliable for this repository (it never fired), so the workflow keeps
# its own time: a run started with loop=true repeats the update every 15 minutes for about 5.5 hours
# and then starts its successor. The cron below only restarts the chain if it ever breaks.
# To start it by hand: Actions tab -> Update berth data -> Run workflow -> tick "loop".
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      loop:
        description: Keep running every 15 minutes and start a successor (normal operation)
        type: boolean
        default: true
      force:
        description: Publish even if nothing changed, and re-read Shiptrail now
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# One chain at a time: a second run waits, and a newer waiting run replaces an older one.
concurrency:
  group: update-berth-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - name: Update (looping every 15 minutes when loop is on)
        env:
          CLAUDE_FIRE_URL: ${{ secrets.CLAUDE_FIRE_URL }}
          CLAUDE_FIRE_TOKEN: ${{ secrets.CLAUDE_FIRE_TOKEN }}
          LOOP: ${{ github.event_name == 'schedule' || inputs.loop }}
          FORCE: ${{ inputs.force }}
        run: |
          node --version
          if [ "$LOOP" != "true" ]; then
            scripts/ci-run.sh $([ "$FORCE" = "true" ] && echo "--force --refresh")
            exit $?
          fi
          END=$(( $(date +%s) + 330*60 ))
          first=1
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ "$first" = 1 ] && [ "$FORCE" = "true" ]; then scripts/ci-run.sh --force --refresh; else scripts/ci-run.sh; fi || echo "cycle failed; will retry next cycle"
            first=0
            sleep $(( 900 - $(date +%s) % 900 ))   # until the next quarter hour
          done

      - name: Start the next run of the chain
        if: ${{ always() && (github.event_name == 'schedule' || inputs.loop) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main -f loop=true
